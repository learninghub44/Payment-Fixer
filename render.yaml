services:
  - type: web
    name: kuwesa-payment-api
    runtime: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: bash build.sh
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/healthz
