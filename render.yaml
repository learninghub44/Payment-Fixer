services:
  - type: web
    name: kuwesa-payment-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --ignore-scripts && pnpm --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/healthz
